<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enforcando o Lobo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
:root{--bg:#e6eaed;--surface:#f9fafb;--field:#eef1f3;--ink:#14202b;--muted:#5c6b78;--line:#c3ccd4;--accent:#8a5f0a;--accent-ink:#fff;--pos:#1d7a4d;--neg:#b3261e;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0b0a;--surface:#171513;--field:#201d1a;--ink:#efe9df;--muted:#a0968a;--line:#2f2a25;--accent:#d9a441;--accent-ink:#0c0b0a;--pos:#5fd09a;--neg:#ff8d85;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0b0a;--surface:#171513;--field:#201d1a;--ink:#efe9df;--muted:#a0968a;--line:#2f2a25;--accent:#d9a441;--accent-ink:#0c0b0a;--pos:#5fd09a;--neg:#ff8d85;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
#app{max-width:520px;margin:0 auto;padding:20px 16px 56px}
h1,.big,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;letter-spacing:-.02em}
h1{font-size:30px;line-height:1.1}
.sub{color:var(--muted);margin:4px 0 18px}
.months{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.months strong{font-size:18px}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;cursor:pointer}
.slip{background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
.bal span{color:var(--muted);font-size:14px}
.big{display:block;font-size:42px;line-height:1.1;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.rows{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.row input{width:140px;text-align:right}
label{display:block;font-size:14px;color:var(--muted);margin-top:12px}
input,select{width:100%;margin-top:4px;padding:12px;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer}
.link{background:none;border:0;color:var(--accent);padding:8px 0;font-size:14px;text-decoration:underline}
h2{font-size:20px;margin:22px 0 10px}
.primary,.ghost{padding:13px 16px;border-radius:8px;font-weight:600;border:1px solid var(--accent)}
.primary{background:var(--accent);color:var(--accent-ink)}
.ghost{background:none;color:var(--accent)}
.add{width:100%;margin-bottom:12px}
.banks,.seg{display:grid;gap:8px;margin-top:6px}
.banks{grid-template-columns:repeat(3,1fr)}.seg{grid-template-columns:1fr 1fr}
.bk,.sg{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px}
.sg{padding:12px}
.bk.on,.sg.on{border:2px solid var(--accent);padding:9px 5px}.sg.on{padding:11px}
.logo{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:10px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;line-height:1}
.pv{margin-top:14px;padding:12px;border:1px dashed var(--line);border-radius:6px;font-size:14px;font-variant-numeric:tabular-nums}
.pv b{font-size:18px}
.acts{display:flex;gap:10px;margin-top:14px}.acts .primary{flex:1}
.crow{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px dashed var(--line)}
.crow:last-child{border-bottom:0}
.cbody{flex:1;min-width:0;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.cbody b{color:var(--ink)}
.ctop{display:flex;justify-content:space-between;gap:8px;color:var(--ink);font-size:16px;margin-bottom:2px}
.x{border:0;background:none;color:var(--muted);font-size:18px;width:36px;height:36px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.ex{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.ex .primary{grid-column:1/-1}
.note{color:var(--muted);font-size:13px;margin-top:22px}
.chk{display:flex;align-items:center;gap:10px;color:var(--ink)}
.chk input{width:22px;height:22px;margin:0;padding:0;flex:none}
.sm{padding:8px 14px;font-size:14px;margin-top:8px}
.brand{background:#000;border-radius:14px;padding:14px 12px;margin-bottom:16px;text-align:center}
.brand img{display:block;width:min(100%,280px);height:auto;margin:0 auto}
.brand .sub{color:#b8ad9b;margin:4px 0 0;font-size:14px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

:root:root:root{--bg:#050505;--surface:#0a0a0a;--field:#0b0a08;--ink:#f4efe6;--muted:#b9ad98;--line:#5e4716;--accent:#e3b341;--accent-ink:#1a1204;--pos:#f2c14e;--neg:#ff4b43;color-scheme:dark}
body{position:relative;overflow-x:hidden;background:repeating-linear-gradient(118deg,transparent 0 58px,rgba(217,164,65,.05) 58px 59px,transparent 59px 131px),radial-gradient(110% 45% at 50% 0,#1c1409,transparent 70%),#050505}
body::before,body::after{content:"";position:absolute;z-index:0;pointer-events:none;background:repeating-linear-gradient(62deg,transparent 0 9px,rgba(190,18,26,.85) 9px 12px,transparent 12px 24px,rgba(190,18,26,.5) 24px 25px,transparent 25px 40px);-webkit-mask-image:linear-gradient(135deg,#000,transparent 70%);mask-image:linear-gradient(135deg,#000,transparent 70%)}
body::before{top:0;left:0;width:150px;height:190px}
body::after{right:0;top:430px;width:130px;height:180px;transform:scaleX(-1)}
#app{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:4px;background:none;border-radius:0;padding:0;margin:0 0 14px;text-align:left}
.brand .mark{flex:0 0 44%;width:44%;max-width:210px;margin:0}
.brand .lock{flex:1;min-width:0}
.brand .word{display:block;width:100%;height:auto;margin:0}
.brand .sub{font:italic 600 11px/1.2 Oswald,"Arial Narrow",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.03em;color:#e8dcc4;margin:6px 0 0}
.nav{border:1.5px solid #d9a441;background:#0a0a0a;color:#e3b341;box-shadow:0 0 14px rgba(217,164,65,.25)}
.months strong{flex:1;margin:0 10px;text-align:center;padding:12px 8px;border:1.5px solid #b88a2e;border-radius:999px;background:#0a0a0a;box-shadow:0 0 14px rgba(217,164,65,.2)}
.slip{border:1.5px solid transparent;border-radius:18px;background:repeating-linear-gradient(118deg,transparent 0 46px,rgba(217,164,65,.06) 46px 47px,transparent 47px 97px) padding-box,linear-gradient(#0b0a09,#0b0a09) padding-box,linear-gradient(135deg,#fbe29a,#b88a2e 38%,#5a3d0c 62%,#e8c25f) border-box;box-shadow:0 0 18px rgba(217,164,65,.2),inset 0 0 28px rgba(0,0,0,.7)}
.bal{position:relative}
.bal span{color:var(--ink);font-size:16px}
.trend{position:absolute;right:0;top:4px;width:76px;height:auto;filter:drop-shadow(0 0 6px rgba(227,179,65,.5))}
.big{background:linear-gradient(180deg,#fff3c1,#e3b341 55%,#9a6a14);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 0 10px rgba(227,179,65,.4))}
.big.neg{background:linear-gradient(180deg,#ffb0a9,#ff4b43 60%,#9d130c);-webkit-background-clip:text;background-clip:text}
.rows{border-top:1px solid;border-image:linear-gradient(90deg,transparent,#d9a441 15%,#d9a441 85%,transparent) 1}
h2{display:flex;align-items:center;gap:10px}
.ic{width:34px;height:26px;flex:none;filter:drop-shadow(0 0 5px rgba(227,179,65,.5))}
.primary{background:linear-gradient(180deg,#fbe29a,#e3b341 42%,#b4801f 56%,#f1cf6b);color:#1a1204;border:1.5px solid #fbe29a;border-radius:12px;box-shadow:0 0 16px rgba(227,179,65,.35)}
.ghost{border:1.5px solid #b88a2e;border-radius:12px;color:#e3b341;background:none}
.add{font-size:18px;padding:15px 16px}
input,select{background:#080706;border:1.5px solid #b88a2e;border-radius:12px;box-shadow:0 0 10px rgba(217,164,65,.15)}
.bk,.sg{background:#0a0908;border-radius:12px}
.bk.on,.sg.on{border-color:#e3b341;box-shadow:0 0 14px rgba(227,179,65,.4)}
.logo{width:58px;height:58px;border-radius:12px;gap:2px;align-content:center}
.logo i{font-style:normal;font-size:9px;font-weight:800;color:#fff;letter-spacing:.02em}
.ctop span{color:#e3b341;font-weight:600}
.link{color:#f2c14e}
.x{color:#d9a441}
.pv{border-color:#5e4716;border-radius:10px}
.crow{border-bottom-color:#3a2d12}
.brand{flex-direction:column;gap:8px;text-align:center}
.brand .mark{flex:none;width:min(100%,300px);max-width:none}
.brand .lock{flex:none}
.brand .sub{margin:0;text-align:center;font-size:12px}
</style>

  <div class="lock"><p class="sub">Planeje os cartões que vai passar em cada mês.</p></div></header>

  <nav class="months">
    <button class="nav" id="prev" aria-label="Mês anterior">‹</button>
    <strong id="mlabel"></strong>
    <button class="nav" id="next" aria-label="Próximo mês">›</button>
  </nav>

  <section class="slip">
    <div class="bal"><span>Saldo positivo</span><b class="big" id="saldo"></b><svg class="trend" viewBox="0 0 64 48" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe29a"/><stop offset="1" stop-color="#a87414"/></linearGradient></defs><rect x="2" y="34" width="11" height="12" fill="url(#gg)"/><rect x="17" y="26" width="11" height="20" fill="url(#gg)"/><rect x="32" y="18" width="11" height="28" fill="url(#gg)"/><rect x="47" y="10" width="11" height="36" fill="url(#gg)"/><path d="M2 26 17 14l11 6L56 3" fill="none" stroke="#fbe29a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M47 2h10v10" fill="none" stroke="#fbe29a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="rows">
      <div class="row"><span>Saldo inicial</span><input id="start" inputmode="decimal" placeholder="0,00" aria-label="Saldo inicial do mês"></div>
      <div class="row"><span>Pago com o saldo</span><b id="paid"></b></div>
      <div class="row"><span>Recebido ao passar</span><b id="recv"></b></div>
      <div class="row"><span>Gastos</span><b id="spent"></b></div>
    </div>
    <button class="link" id="carry">Trazer saldo do mês anterior</button>
  </section>

  <h2><svg class="ic" viewBox="0 0 34 26" aria-hidden="true"><defs><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe29a"/><stop offset="1" stop-color="#b4801f"/></linearGradient></defs><rect x="1" y="1" width="32" height="24" rx="4" fill="url(#gc)"/><rect x="1" y="7" width="32" height="4" fill="#1a1204" opacity=".75"/><rect x="5" y="17" width="6" height="3" rx="1" fill="#1a1204"/></svg>Cartões do mês</h2>
  <button class="primary add" id="addc">+ Adicionar cartão</button>

  <section class="slip" id="cform" hidden>
    <span style="font-size:14px;color:var(--muted)">Banco</span>
    <div class="banks" id="banks"></div>
    <label for="climit">Limite disponível (R$)</label>
    <input id="climit" inputmode="decimal" placeholder="0,00">

      <input id="eval" inputmode="decimal" placeholder="0,00" style="width:110px" aria-label="Valor do gasto">
      <button class="primary" id="eadd">Adicionar gasto</button>
    </div>
  </section>

  <p class="note">Taxas de crédito da tabela que você informou, iguais para os três bancos. Os dados ficam salvos só neste navegador.</p>
</main>

<script>
const $=s=>document.querySelector(s);
const FEES={
  tap:[3.15,5.39,6.12,6.85,7.57,8.28,8.99,9.69,10.38,11.06,11.74,12.40],
  link:[4.20,6.09,7.01,7.91,8.80,9.67,12.59,13.42,14.25,15.06,15.87,16.66]
};
const BANKS={
  sicoob:{name:'Sicoob',bg:'#003641',fg:'#fff',mark:'<svg width="24" height="18" viewBox="0 0 24 18" aria-hidden="true"><path d="M1 1h22L12 17z" fill="#8dc63f"/><path d="M6 1h12L12 11z" fill="#00a5b5"/></svg><i>SICOOB</i>',fs:11},
  nubank:{name:'Nubank',bg:'#820ad1',fg:'#fff',mark:'nu',fs:20},
  itau:{name:'Itaú',bg:'#ec7000',fg:'#003399',mark:'itaú',fs:16}
};
const KEY='lobo-v1';
let db={months:{}};
try{const r=localStorage.getItem(KEY);if(r){db=JSON.parse(r)||db;if(!db.months)db.months={}}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
let y=new Date().getFullYear(),mo=new Date().getMonth();
const key=(yy,mm)=>{const d=new Date(yy,mm,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const get=k=>db.months[k]||(db.months[k]={start:0,cards:[],exps:[]});
const fmt=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pct=n=>n.toFixed(2).replace('.',',')+'%';
const r2=n=>Math.round(n*100)/100;
const num=s=>{s=String(s).trim().replace(/[^\d,.-]/g,'');
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  return parseFloat(s)||0};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const logo=b=>`<span class="logo" style="background:${b.bg};color:${b.fg};font-size:${b.fs}px">${b.mark}</span>`;
const nlabel=n=>n===1?'À vista':n+'x';

function calc(m){
  let run=m.start||0,recv=0,paid=0;
  const rows=m.cards.map(c=>{
    const fee=FEES[c.mode][c.n-1],disc=r2(c.limit*fee/100),net=r2(c.limit-disc),parc=r2(c.limit/c.n);
    run=r2(run-c.limit);paid=r2(paid+c.limit);
    if(c.passed){run=r2(run+net);recv=r2(recv+net)}
    return {c,fee,disc,net,run,parc,next:r2((c.bill||0)+parc)};
  });
  const spent=r2(m.exps.reduce((a,e)=>a+e.v,0));
  return {rows,recv,paid,spent,saldo:r2(run-spent)};
}

function render(){
  const m=get(key(y,mo)),c=calc(m);
  const lbl=new Date(y,mo,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  $('#mlabel').textContent=lbl.charAt(0).toUpperCase()+lbl.slice(1);
  const s=$('#saldo');s.textContent=fmt(c.saldo);s.className='big '+(c.saldo<0?'neg':'pos');
  $('#paid').textContent='− '+fmt(c.paid);
  $('#recv').textContent='+ '+fmt(c.recv);
  $('#spent').textContent='− '+fmt(c.spent);
  if(document.activeElement!==$('#start'))$('#start').value=m.start?String(m.start).replace('.',','):'';

  $('#cards').innerHTML=c.rows.map((r,i)=>{
    const b=BANKS[r.c.bank];
    return `<div class="crow">${logo(b)}<div class="cbody">
      <div class="ctop"><b>${b.name}</b><span>${r.c.mode==='tap'?'Aproximação':'Link'}, ${nlabel(r.c.n)}</span></div>
      Limite ${fmt(r.c.limit)} · taxa ${pct(r.fee)} (− ${fmt(r.disc)})<br>
      Desconta do saldo: − <b>${fmt(r.c.limit)}</b> · ${r.c.passed?'Recebido: + ':'Ao passar recebe: '}<b>${fmt(r.net)}</b><br>Saldo após este cartão: <b>${fmt(r.run)}</b><br>
      Próximo mês: fatura ${fmt(r.c.bill||0)} + parcela ${fmt(r.parc)} = <b>${fmt(r.next)}</b><br><button class="${r.c.passed?'link':'primary sm'}" data-pass="${i}">${r.c.passed?'Cartão passado. Desfazer':'Passei o cartão'}</button>
    </div><button class="x" data-del="${i}" aria-label="Remover cartão">✕</button></div>`;
  }).join('')||'<p class="empty">Nenhum cartão neste mês. Adicione o primeiro para começar.</p>';

  const fat=r2(m.cards.reduce((a,x)=>a+(x.bill||0),0)),par=r2(c.rows.reduce((a,r)=>a+r.parc,0)),tot=r2(fat+par),after=r2(c.saldo-tot);
  $('#plan').innerHTML=m.cards.length?`<div class="rows" style="border:0;margin:0;padding:0">
    <div class="row"><span>Faturas informadas</span><b>${fmt(fat)}</b></div>
    <div class="row"><span>Parcelas dos cartões passados</span><b>${fmt(par)}</b></div>
    <div class="row"><span>Total do próximo mês</span><b>${fmt(tot)}</b></div>
    <div class="row"><span>Saldo depois de cobrir</span><b class="${after<0?'neg':'pos'}">${fmt(after)}</b></div></div>`
    :'<p class="empty">Informe a fatura de cada cartão para ver o total do próximo mês.</p>';

  $('#exps').innerHTML=m.exps.map((e,i)=>`<div class="crow" style="align-items:center"><div class="cbody" style="color:var(--ink)">${esc(e.d)}</div><b>− ${fmt(e.v)}</b><button class="x" data-delx="${i}" aria-label="Remover gasto">✕</button></div>`).join('')||'<p class="empty">Nenhum gasto neste mês.</p>';
}

/* navegação */
$('#prev').onclick=()=>{mo--;if(mo<0){mo=11;y--}render()};
$('#next').onclick=()=>{mo++;if(mo>11){mo=0;y++}render()};
$('#start').onchange=e=>{get(key(y,mo)).start=num(e.target.value);save();render()};
$('#carry').onclick=()=>{const p=db.months[key(y,mo-1)];get(key(y,mo)).start=p?calc(p).saldo:0;save();render()};

/* formulário de cartão */
const d={bank:'sicoob',mode:'tap'};
$('#banks').innerHTML=Object.entries(BANKS).map(([k,b])=>`<button class="bk" data-bank="${k}">${logo(b)}${b.name}</button>`).join('');
$('#cn').innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}">${nlabel(i+1)}</option>`).join('');
function sel(){
  document.querySelectorAll('[data-bank]').forEach(b=>b.classList.toggle('on',b.dataset.bank===d.bank));
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===d.mode));
  const limit=num($('#climit').value),n=+$('#cn').value,fee=FEES[d.mode][n-1];
  const disc=r2(limit*fee/100);
  const cur=calc(get(key(y,mo))).saldo,net=r2(limit-disc),base=r2(cur-limit);
  
  $('#pv').innerHTML=`Taxa ${pct(fee)} · desconto ${fmt(disc)} · parcela de ${fmt(r2(limit/n))} por mês<br>Ao adicionar, desconta ${fmt(limit)} e o saldo fica em <b>${fmt(base)}</b><br>Ao passar o cartão, vai para <b>${fmt(r2(base+net))}</b>`;
}
$('#banks').onclick=e=>{const b=e.target.closest('[data-bank]');if(b){d.bank=b.dataset.bank;sel()}};
$('#modes').onclick=e=>{const b=e.target.closest('[data-mode]');if(b){d.mode=b.dataset.mode;sel()}};
['#climit','#cn'].forEach(s=>$(s).addEventListener('input',sel));
$('#addc').onclick=()=>{$('#cform').hidden=false;$('#addc').hidden=true;sel();$('#climit').focus()};
const closeForm=()=>{$('#cform').hidden=true;$('#addc').hidden=false;$('#climit').value='';$('#cbill').value='';$('#cn').value='1'};
$('#ccancel').onclick=closeForm;
$('#csave').onclick=()=>{
  const limit=num($('#climit').value);
  if(limit<=0){$('#climit').focus();return}
  get(key(y,mo)).cards.push({bank:d.bank,mode:d.mode,n:+$('#cn').value,limit,bill:num($('#cbill').value),pay:true,passed:false});
  save();closeForm();render();
};
$('#cards').onclick=e=>{const m=get(key(y,mo)),p=e.target.closest('[data-pass]'),b=e.target.closest('[data-del]');if(p){const c=m.cards[+p.dataset.pass];c.passed=!c.passed;save();render()}if(b){m.cards.splice(+b.dataset.del,1);save();render()}};

/* gastos */
$('#eadd').onclick=()=>{
  const v=num($('#eval').value);
  if(v<=0){$('#eval').focus();return}
  get(key(y,mo)).exps.push({d:$('#edesc').value.trim()||'Gasto',v});
  $('#edesc').value='';$('#eval').value='';save();render();
};
$('#exps').onclick=e=>{const b=e.target.closest('[data-delx]');if(b){get(key(y,mo)).exps.splice(+b.dataset.delx,1);save();render()}};

sel();render();
</script>
</body>
</html>
